<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - SMAS Katolik St. Albertus Malang</title>
    <link rel="stylesheet" href="/pages/assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header id="header"></header>

    <section id="kontak" class="kontak">
        <div class="form-box">
            <div class="kiri">
                <h1>Hubungi Kami</h1>
                
                <div class="info-group">
                    <p class="label">Alamat</p>
                    <p class="isi">Jl. Talang 1, Malang 65112<br>Jawa Timur, Indonesia</p>
                </div>
                
                <div class="info-group">
                    <p class="label">Nomor Telepon</p>
                    <p class="isi">(+62) 341 564556</p>
                </div>
                
                <div class="info-group">
                    <p class="label">Email</p>
                    <p class="isi">sma@dempoku.com</p>
                </div>

                <div class="info-group">
                    <p class="label">Jam Operasional</p>
                    <p class="isi">Senin - Sabtu</p>
                    <p class="isi">07:00 - 16:00 WIB</p>
                </div>
            </div>

            <form class="kanan" action="#" method="POST">
                <div class="input-row">
                    <div class="input-group">
                        <label for="nama">Nama Lengkap *</label>
                        <input id="nama" class="kotak" type="text" placeholder="Masukkan nama lengkap anda" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Email *</label>
                        <input id="email" class="kotak" type="email" placeholder="Masukkan email anda" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="pesan">Pesan *</label>
                    <textarea id="pesan" class="kotak" placeholder="Tuliskan pesan anda..." rows="4" required></textarea>
                </div>
                
                <button class="submit-btn" type="submit">Kirim Pesan</button>
            </form>
        </div>
    </section>

    <footer id="footer"></footer>
    <script src="/pages/assets/js/app.js"></script>
</body>

</html>
